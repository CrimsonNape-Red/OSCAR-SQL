; OSCAR portable mode marker
;
; While this file is in the same folder as OSCAR.exe, OSCAR runs as a portable
; application. Instead of the Windows registry and the Documents folder, it
; keeps its settings and data in a separate folder, so that a new version can
; replace this folder without touching them:
;
;   OSCAR Portable\          this folder (OSCAR itself)
;   OSCAR Portable Data\     Settings and OSCAR20_Data, created on first use
;
; DataFolder below says where that folder is. A relative path is relative to
; this folder; a full path such as E:\OSCAR Data also works. Change it only
; before OSCAR's first use, or move the existing folder to match.
;
; Delete this file to make OSCAR use the registry and the Documents folder again.

[Portable]
DataFolder=..\OSCAR Portable Data
