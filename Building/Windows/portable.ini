; OSCAR portable mode marker
;
; While this file is in the same folder as OSCAR.exe, OSCAR runs as a portable
; application: its settings are kept in the Settings folder here instead of the
; Windows registry, and its data folder (OSCAR20_Data) is created here too.
;
; Delete this file to make OSCAR use the registry and the Documents folder again.
; Nothing in this file is read; only its presence matters.
